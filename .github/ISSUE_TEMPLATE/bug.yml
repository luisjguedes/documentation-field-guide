name: Report a bug
description: Something is broken or confusing
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Where?
      description: Link to the page/section.
    validations:
      required: true
  - type: textarea
    attributes:
      label: What did you expect?
    validations:
      required: false
