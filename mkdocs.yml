site_name: Documentation Field Guide
site_description: Decision frameworks, failure modes, and delivery patterns for technical documentation at scale.
site_url: https://<YOUR_GITHUB_USERNAME>.github.io/documentation-field-guide/
repo_url: https://github.com/<YOUR_GITHUB_USERNAME>/documentation-field-guide
repo_name: documentation-field-guide
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.action.edit
    - content.action.view
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/white-balance-sunny
        name: Switch to light mode

plugins:
  - search
  - awesome-pages
  - git-revision-date-localized:
      enable_creation_date: true

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/<YOUR_GITHUB_USERNAME>

nav:
  - Start here: index.md
  - Decisions: decisions/index.md
  - Systems: systems/index.md
  - Delivery: delivery/index.md
  - Quality: quality/index.md
  - Templates: templates/index.md
  - Library: library/index.md
  - Contribute: contribute.md
